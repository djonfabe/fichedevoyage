<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Erreur serveur')}"></head>
<body class="bg-gray-50 font-sans">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="max-w-2xl mx-auto px-4 py-24 text-center">
    <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <span class="text-5xl font-extrabold text-red-500">500</span>
    </div>
    <h1 class="text-3xl font-bold text-bleu mb-3">Erreur serveur</h1>
    <p class="text-gray-500 mb-8">
        Une erreur inattendue s'est produite. Veuillez réessayer dans quelques instants.
        Si le problème persiste, contactez le support.
    </p>
    <div class="flex flex-wrap gap-4 justify-center">
        <a th:href="@{/}" class="bg-bleu text-white px-6 py-3 rounded-xl font-semibold hover:bg-bleu-light transition-all shadow">
            Retour à l'accueil
        </a>
        <a th:href="@{/contact}" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-semibold hover:bg-gray-300 transition-all">
            Contacter le support
        </a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Page introuvable')}"></head>
<body class="bg-gray-50 font-sans">
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="max-w-2xl mx-auto px-4 py-24 text-center">
    <div class="w-24 h-24 bg-or bg-opacity-20 rounded-full flex items-center justify-center mx-auto mb-6">
        <span class="text-5xl font-extrabold text-or">404</span>
    </div>
    <h1 class="text-3xl font-bold text-bleu mb-3">Page introuvable</h1>
    <p class="text-gray-500 mb-8">
        La page ou la fiche que vous recherchez n'existe pas ou a été supprimée.
    </p>
    <div class="flex flex-wrap gap-4 justify-center">
        <a th:href="@{/}" class="bg-bleu text-white px-6 py-3 rounded-xl font-semibold hover:bg-bleu-light transition-all shadow">
            Retour à l'accueil
        </a>
        <a th:href="@{/P0013}" class="bg-or text-bleu-dark px-6 py-3 rounded-xl font-semibold hover:bg-or-light transition-all shadow">
            Remplir une fiche
        </a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

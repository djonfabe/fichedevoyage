spring:
  application:
    name: fiche-voyage-api-admin

  datasource:
    url: jdbc:h2:mem:fichedevoyage;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    username: noreply@fichedevoyage.td
    password:

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8081

app:
  base-url: http://localhost:8081
  jwt:
    secret: dev-secret-key-change-in-production-must-be-at-least-256-bits-long
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
